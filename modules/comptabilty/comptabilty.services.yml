services:
  comptabilty.manager:
    class: Drupal\comptabilty\ComptabiltyManager
    arguments: ['@entity_type.manager', '@current_user']
  comptabilty.duplicate_operation_subscriber:
    class: Drupal\comptabilty\EventSubscriber\DuplicateOperationSubscriber
    arguments: ['@comptability_access.api_user', '@entity_type.manager']
    tags:
      - { name: event_subscriber }
